<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TASK / BOARD</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#222;background:#f7f7f7}
*{box-sizing:border-box}body{margin:0;padding:32px 16px}.wrap{max-width:1060px;margin:auto;background:white;border:1px solid #e4e4e4;border-radius:12px;padding:28px}
header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #222;padding-bottom:20px}
small{color:#888;letter-spacing:.12em}h1{font-size:26px;letter-spacing:.06em;margin:6px 0 0}.count{text-align:right}.count strong{font-size:32px;display:block}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:24px 0 14px}h2{font-size:17px;margin:0}
button,input,select{font:inherit}button{cursor:pointer}.primary{background:#2563EB;color:white;border:0;border-radius:6px;padding:10px 16px}
form{
  display:none;
  gap:10px;
  flex-wrap:wrap;
  background:#f5f5f5;
  padding:16px;
  border-radius:8px;
  margin-bottom:18px

}
form.open{
  display:flex
}

input,select{border:1px solid #ccc;border-radius:5px;padding:9px;min-width:0}#content{flex:1;min-width:180px}
.table-wrap {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
table{width:100%;border-collapse:collapse;min-width:660px;text-align:left}th{font-size:12px;color:#777;font-weight:500;border-bottom:1px solid #ddd;padding:12px 10px}td{border-bottom:1px solid #eee;padding:12px 10px;font-size:14px}
tr.done{background:#17253B;color:#ddd}tr.done td{border-color:#353535}tr.done .task{text-decoration:line-through;color:#aaa}
.tag{border-radius:4px;padding:4px 9px;font-size:12px;display:inline-block}.処理{background:#eee5ff;color:#6930a5}.設計{background:#e2efff;color:#2863a5}.創作{background:#dff4e7;color:#227a4d}
tr.done .tag{background:#444;color:#ddd}.status{background:none;border:1px solid #aaa;border-radius:50%;width:25px;height:25px;color:#777}.done .status{border-color:#777;color:white}
.more{background:none;border:0;color:inherit;font-size:20px}.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:20px;font-size:12px;color:#888}
.filters {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}

.filter-btn {
  background: white;
  color: #555;
  border: 1px solid #ddd;
  border-radius: 6px;
  padding: 8px 16px;
}

.filter-btn.active {
  background: #2563EB;
  color: white;
  border-color: #2563EB;
}

.category-filter {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}

.category-filter label {
  font-size: 14px;
  color: #555;
}

#categoryFilter {
  min-width: 160px;
  background: white;
}

.search-box {
  margin-bottom: 16px;
}

#searchInput {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid #ddd;
  border-radius: 6px;
  background: white;
  font-size: 14px;
}

#searchInput:focus {
  outline: 2px solid #2563EB;
  outline-offset: 2px;
}

.empty-message {
  text-align: center;
  color: #888;
  padding: 40px 12px;
  font-size: 14px;
  background: #fafafa;
}

.empty-reset {
  display: block;
  margin: 16px auto 0;
  padding: 9px 16px;
  background: white;
  color: #2563EB;
  border: 1px solid #2563EB;
  border-radius: 6px;
  cursor: pointer;
}

.empty-reset:hover {
  background: #eff6ff;
}

.reset-area {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 16px;
}

#resetFilters {
  background: white;
  color: #2563EB;
  border: 1px solid #2563EB;
  border-radius: 6px;
  padding: 8px 14px;
}

#resetFilters:hover {
  background: #eff6ff;
}

.sort-area {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 10px;
  margin-bottom: 16px;
}

.sort-area label {
  font-size: 14px;
  color: #555;
}

#sortOrder {
  min-width: 140px;
  background: white;
}

.scroll-hint {
  display: none;
  font-size: 12px;
  color: #777;
  margin: 0 0 10px;
}

@media (max-width: 600px) {
  .scroll-hint {
    display: block;
  }

  .table-wrap {
    border: 1px solid #eee;
    border-radius: 6px;
  }

  table {
    min-width: 660px;
  }

  th, td {
    padding: 12px 10px;
    white-space: nowrap;
  }

  td.task {
    white-space: normal;
    min-width: 180px;
    overflow-wrap: anywhere;
  }
}

@media (max-width: 600px) {
  .toolbar {
    flex-direction: column;
    align-items: stretch;
  }

  .toolbar-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .toolbar-actions button {
    min-width: 0;
    padding: 10px 6px;
    font-size: 13px;
  }

  #toggle {
    grid-column: 1 / -1;
  }
}

@media(max-width:600px){body{padding:8px}.wrap{padding:16px;border-radius:8px}h1{font-size:21px}.count strong{font-size:26px}}

@media (max-width: 600px) {
  #form.open {
    flex-direction: column;
  }

  #form input,
  #form select,
  #form button {
    width: 100%;
    min-width: 0;
  }

  #form #content {
    min-width: 0;
    flex: none;
  }

  #form input,
  #form select {
    min-height: 44px;
  }

  #form button {
    min-height: 46px;
  }
}

@media (max-width: 600px) {
  .filters {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 6px;
  }

  .filter-btn {
    width: 100%;
    min-width: 0;
    min-height: 44px;
    padding: 10px 4px;
    font-size: 13px;
    white-space: nowrap;
  }
}

@media (max-width: 600px) {
  #categoryFilter,
  #sortOrder {
    width: 100%;
    min-width: 0;
    min-height: 44px;
    font-size: 16px;
  }

  .sort-area {
    flex-direction: column;
    align-items: stretch;
    gap: 6px;
  }

  .sort-area label {
    text-align: left;
  }
}

.search-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}

.search-actions #searchInput {
  flex: 1;
  min-width: 0;
}

@media (max-width: 600px) {
  .search-actions {
    flex-direction: column;
    align-items: stretch;
  }

  .search-actions #searchInput,
  .search-actions #resetFilters {
    width: 100%;
    min-width: 0;
    min-height: 44px;
  }

  .search-actions #searchInput {
    font-size: 16px;
  }
}

</style>
</head>
<body><main class="wrap">
<header><div><small>PERSONAL TASK LIST</small><h1>MY TASK MANAGER</h1></div><div class="count"><strong id="remaining">00</strong><small>未完了タスク</small></div></header>
<div class="toolbar">
  <h2>タスク一覧</h2>
  <div class="toolbar-actions">
    <button id="backup">↓ バックアップ</button>
    <button id="restore">↑ 復元</button>
    <input type="file" id="restoreFile"
           accept=".json,application/json"
           style="display:none">
    <button class="primary" id="toggle">＋ 新規登録</button>
  </div>
</div>
<form id="form"><input type="date" id="registered" aria-label="登録日" required><input id="content" placeholder="タスクの内容" maxlength="200" required><select id="category"><option>処理</option><option>設計</option><option>創作</option></select><button class="primary" type="submit">登録する</button></form>
<div class="filters">
  <button class="filter-btn active" data-filter="all">すべて</button>
  <button class="filter-btn" data-filter="todo">未完了</button>
  <button class="filter-btn" data-filter="done">完了済み</button>
</div>
<div class="category-filter">
  <label for="categoryFilter">分類：</label>
  <select id="categoryFilter">
    <option value="all">すべての分類</option>
    <option value="処理">処理</option>
    <option value="設計">設計</option>
    <option value="創作">創作</option>
  </select>
</div>

<div class="search-actions">
  <input
    id="searchInput"
    type="search"
    placeholder="キーワード検索"
  >
  <button id="resetFilters" type="button">
    ↺ 条件をリセット
  </button>
</div>

<div class="sort-area">
  <label for="sortOrder">並び順：</label>
  <select id="sortOrder">
    <option value="new">新しい順</option>
    <option value="old">古い順</option>
  </select>
</div>

<p class="scroll-hint">
  ⇆ 表は左右にスクロールできます
</p>

<div class="table-wrap"><table><thead><tr><th>登録日</th><th>内容</th><th>分類</th><th>完了日</th><th>状態</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="foot"><span>完了から7日経過したタスクは自動削除されます</span>

  <span>
    <span id="visibleCount"></span>
    <span id="stats"></span>
  </span>

</div>
</main>
<script>
const KEY='my-task-board-v1';
const localDate=(d=new Date())=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const $=id=>document.getElementById(id);
let currentFilter = 'all';
let currentCategory = 'all';
let searchKeyword = '';
let currentSort = localStorage.getItem('my-task-sort') || 'new';

let tasks; 
try{tasks=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(tasks))tasks=[]}catch{tasks=[]}
function purge(){const now=new Date(localDate()+'T00:00:00').getTime();tasks=tasks.filter(t=>!t.completed||now-new Date(t.completed+'T00:00:00').getTime()<7*86400000)}
function save(){purge();localStorage.setItem(KEY,JSON.stringify(tasks));render()}
function td(tr,value,cls){const el=document.createElement('td');if(cls)el.className=cls;el.textContent=value;tr.appendChild(el);return el}
function render(){purge();localStorage.setItem(KEY,JSON.stringify(tasks));$('rows').replaceChildren();

const filtered = tasks.filter(t => {
  const matchStatus =
    currentFilter === 'all' ||
    (currentFilter === 'todo' && !t.completed) ||
    (currentFilter === 'done' && !!t.completed);

  const matchCategory =
    currentCategory === 'all' ||
    t.category === currentCategory;

  const matchKeyword =
    t.content.toLowerCase().includes(
      searchKeyword.toLowerCase()
    );

  return matchStatus && matchCategory && matchKeyword;
});

$('visibleCount').textContent =
  `表示中：${filtered.length}件 / 全${tasks.length}件　｜　`;

const sorted = [...filtered].sort((a, b) => {
  if (currentSort === 'new') {
    return b.registered.localeCompare(a.registered);
  } else {
    return a.registered.localeCompare(b.registered);
  }
});

if (sorted.length === 0) {
  const tr = document.createElement('tr');
  const cell = document.createElement('td');

  cell.colSpan = 6;
  cell.className = 'empty-message';

  const message = document.createElement('p');

  if (tasks.length === 0) {
    message.textContent =
      'まだタスクがありません。「＋ 新規登録」から最初のタスクを追加しましょう。';
  } else {
    message.textContent = '該当するタスクはありません';
  }

  const resetButton = document.createElement('button');
  resetButton.textContent = '↺ 条件をリセット';
  resetButton.className = 'empty-reset';

  resetButton.onclick = () => {
    $('resetFilters').click();
  };

  cell.appendChild(message);

  if (tasks.length > 0) {
    cell.appendChild(resetButton);
  }

  tr.appendChild(cell);
  $('rows').appendChild(tr);
}

for(const t of sorted){const tr=document.createElement('tr');if(t.completed)tr.className='done';
td(tr,t.registered);td(tr,t.content,'task');
const cat=td(tr,'');const span=document.createElement('span');span.className='tag '+t.category;span.textContent=t.category;cat.append(span);
td(tr,t.completed||'—');
const state=td(tr,'');
const toggle=document.createElement('button');

toggle.className='status';
toggle.textContent=t.completed?'✓':'○';
toggle.title=t.completed?'完了を取り消す':'完了する';

  toggle.onclick = () => {
    if (t.completed) {
      t.completed = null;
      save();
      alert('タスクの完了を取り消しました！');
    } else {
      t.completed = localDate();
      save();
      alert('タスクを完了しました！');
    }
  };

state.append(toggle);

const actions=td(tr,'');const more=document.createElement('button');more.className='more';more.textContent='⋯';more.title='編集・削除';more.onclick=()=>{const choice=prompt('「編集」または「削除」と入力してください');
  
  if (choice === '削除') {
    const message =
      '次のタスクを削除しますか？\n\n' +
      '「' + t.content + '」\n\n' +
      '※削除したタスクは元に戻せません。';

    const ok = confirm(message);
    
    if (ok) {
      tasks = tasks.filter(x => x.id !== t.id);
      save();

      alert('タスクを削除しました！');
    }

  }

  else if (choice === '編集') {
    const v = prompt('内容を編集（200文字以内）', t.content);

    if (v === null) {
      return;
    }

    const newContent = v.trim();

    if (newContent.length === 0) {
      alert('タスクの内容を入力してください。');
      return;
    }

    if (newContent.length > 200) {
      alert('タスクの内容は200文字以内で入力してください。');
      return;
    }

    t.content = newContent;
    save();
    $('resetFilters').click();
    alert('タスクを編集しました！');

  }

};actions.append(more);$('rows').append(tr)}

const done=tasks.filter(t=>t.completed).length;$('remaining').textContent=String(tasks.length-done).padStart(2,'0');$('stats').textContent=`全 ${tasks.length} 件 ／ 完了 ${done} 件 ／ 完了率 ${tasks.length?Math.round(done/tasks.length*100):0}%`}

$('toggle').onclick = () => {
  const form = $('form');
  form.classList.toggle('open');

  if (form.classList.contains('open')) {
    $('registered').value = localDate();
    $('toggle').textContent = '× 閉じる';
  } else {
    $('toggle').textContent = '＋ 新規登録';
  }
};

$('form').onsubmit = e => {
  e.preventDefault();

  tasks.push({
    id: crypto.randomUUID(),
    registered: $('registered').value,
    content: $('content').value.trim(),
    category: $('category').value,
    completed: null
  });

  $('form').reset();
  $('registered').value = localDate();
  
  $('form').classList.remove('open');
  $('toggle').textContent = '＋ 新規登録';
  save();

  $('resetFilters').click();

  alert('新しいタスクを登録しました！');

};

$('backup').onclick = () => {
  const data = JSON.stringify(tasks, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);

  const link = document.createElement('a');
  link.href = url;
  link.download = 'task-backup.json';
  link.click();

  URL.revokeObjectURL(url);
};
$('restore').onclick = () => {
  $('restoreFile').click();
};
$('restoreFile').onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;

  try {
    const text = await file.text();
    const data = JSON.parse(text);

    if (!Array.isArray(data)) {
      throw new Error('配列ではありません');
    }

   
    const isValidDate = value => {
      if (typeof value !== 'string') return false;

      if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) {
        return false;
      }

      const date = new Date(value + 'T00:00:00');

      return !Number.isNaN(date.getTime()) &&
        localDate(date) === value;
    };

    const valid = data.every(t =>
      t !== null &&
      typeof t === 'object' &&
      !Array.isArray(t) &&
      typeof t.id === 'string' &&
      t.id.trim().length > 0 &&
      isValidDate(t.registered) &&
      typeof t.content === 'string' &&
      t.content.trim().length > 0 &&
      t.content.length <= 200 &&
      ['処理', '設計', '創作'].includes(t.category) &&
      (t.completed === null ||
       isValidDate(t.completed))
    );

    if (!valid) {
      throw new Error('タスクの形式が正しくありません');
    }

    const ok = confirm(
      '現在のタスクをバックアップの内容で置き換えます。\n' +
      '現在のタスクは消えるため、先にバックアップを取ってください。\n\n' +
      '復元しますか？'
    );

    if (!ok) return;

    tasks = data;
    save();

    alert('タスクを復元しました！');

  } catch (error) {
    alert('復元できませんでした。JSONファイルを確認してください。');
    console.error(error);
  } finally {
    e.target.value = '';
  }
};
document.querySelectorAll('.filter-btn').forEach(button => {
  button.onclick = () => {
    currentFilter = button.dataset.filter;

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.classList.remove('active');
    });

    button.classList.add('active');

    render();
  };
});

$('categoryFilter').onchange = () => {
  currentCategory = $('categoryFilter').value;
  render();
};

$('searchInput').oninput = () => {
  searchKeyword = $('searchInput').value.trim();
  render();
};

$('sortOrder').onchange = () => {
  currentSort = $('sortOrder').value;
  localStorage.setItem('my-task-sort', currentSort);
  render();
};

$('resetFilters').onclick = () => {
  currentFilter = 'all';
  currentCategory = 'all';
  searchKeyword = '';

  $('categoryFilter').value = 'all';
  $('searchInput').value = '';

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.classList.remove('active');
  });

  document.querySelector('[data-filter="all"]')
    .classList.add('active');

  render();
};

if (currentSort !== 'new' && currentSort !== 'old') {
  currentSort = 'new';
}

$('sortOrder').value = currentSort;

render();
</script></body></html>
