<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MY TASK MANAGER — Cloud</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head><body><main class="wrap">
<section class="auth" aria-label="ログイン"><div class="auth-row"><div><strong>Supabase クラウド</strong><p id="authStatus" class="muted" style="margin:5px 0">ログイン状態を確認中...</p></div><button id="logoutButton" class="hidden" type="button">ログアウト</button></div>
<form id="loginForm" class="hidden"><input id="loginEmail" type="email" autocomplete="email" placeholder="メールアドレス" required><input id="loginPassword" type="password" autocomplete="current-password" placeholder="パスワード" required><button class="primary" type="submit">ログイン</button></form><p id="authMessage" class="message" role="status" aria-live="polite"></p></section>
<nav class="page-nav"><a class="current" href="index.html">タスク一覧</a><a href="recurring.html">繰り返し設定</a></nav>
<header><div><small>PERSONAL TASK LIST</small><h1>MY TASK MANAGER</h1></div><div class="count"><strong id="remaining">—</strong><small>未完了タスク</small></div></header>
<div id="taskArea" class="hidden"><div class="toolbar"><h2>タスク一覧</h2><div class="toolbar-actions"><button id="backup" type="button">↓ クラウドをバックアップ</button><button id="reload" type="button">↻ 再読み込み</button><button id="toggle" class="primary" type="button">＋ 新規登録</button></div></div>
<form id="taskForm"><input type="date" id="registered" aria-label="登録日" required><input id="content" maxlength="200" placeholder="タスクの内容" required><select id="category" aria-label="分類"><option>処理</option><option>設計</option><option>創作</option></select><button id="submitTask" class="primary" type="submit">登録する</button></form>
<div class="filters"><button class="filter-btn active" data-filter="all" type="button">すべて</button><button class="filter-btn" data-filter="todo" type="button">未完了</button><button class="filter-btn" data-filter="done" type="button">完了済み</button></div>
<div class="controls"><label>分類：<select id="categoryFilter"><option value="all">すべての分類</option><option>処理</option><option>設計</option><option>創作</option></select></label><label>並び順：<select id="sortOrder"><option value="new">新しい順</option><option value="old">古い順</option></select></label></div>
<div class="search-actions"><input id="searchInput" type="search" placeholder="キーワード検索"><button id="resetFilters" type="button">↺ 条件をリセット</button></div>
<p id="taskMessage" class="message" role="status" aria-live="polite"></p>
<div class="table-wrap"><table><thead><tr><th>登録日</th><th>内容</th><th>分類</th><th>完了日</th><th>状態</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="foot"><span>完了5日後の自動整理は、バックアップ後に有効化できます</span><span id="stats"></span></div>
<section class="maintenance"><strong>完了タスクの5日後自動削除</strong><p id="cleanupInfo">初期状態は無効です。まずクラウドのJSONバックアップを保存してください。<br>有効化すると、このブラウザでサイトを開いて読み込みに成功した際、完了から5日以上経過したタスクがSupabaseから削除されます。サイトを開いていない間は実行されません。</p><button id="cleanupToggle" type="button">バックアップ後に有効化</button></section>
</div></main>
<script src="js/db.js"></script><script src="js/recurrence.js"></script><script src="js/tasks.js"></script></body></html>
